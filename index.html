<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Тёмный пастельно-зелёный переливающийся фон */
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(-45deg, #7fa88a, #6b9478, #86ad90, #5f8a6c);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            padding: 12px;
            padding-top: 20px;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* Карточка: золотое сечение, внутренние отступы 1/10 */
        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(40, 70, 50, 0.25);
            aspect-ratio: 1 / 1.618;
            display: flex;
            flex-direction: column;
            /* Отступ 1/10 от ширины карточки со всех сторон */
            padding: 10%;
            transition: transform 0.2s ease;
        }

        .card:active {
            transform: scale(0.97);
        }

        /* Внутренняя область, по которой считаем 8 частей */
        .card-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Картинка — квадрат, занимает остаток сверху */
        .card-image {
            flex: 1;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            user-select: none;
        }

        /* Отступ 0.7 из 8 */
        .spacer-07 {
            flex: 0 0 8.75%; /* 0.7 / 8 = 8.75% */
        }

        /* Название — 2 из 8 */
        .card-title {
            flex: 0 0 25%; /* 2 / 8 = 25% */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            line-height: 1.15;
            font-weight: 700;
            color: #ffffff;
            /* Толстая зелёная обводка текста */
            -webkit-text-stroke: 1.2px #2f5a3d;
            paint-order: stroke fill;
            text-shadow: 0 1px 2px rgba(30, 60, 40, 0.4);
            overflow: hidden;
        }

        /* Промежуток 0.5 из 8 */
        .spacer-05 {
            flex: 0 0 6.25%; /* 0.5 / 8 = 6.25% */
        }

        /* Кнопка — 2 из 8, тёмно-зелёная (в 2 раза темнее фона) */
        .card-btn {
            flex: 0 0 25%; /* 2 / 8 = 25% */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #345c42; /* примерно в 2 раза темнее основного фона */
            border: none;
            border-radius: 8px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 1px #1f3a29;
            paint-order: stroke fill;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .card-btn:active {
            background: #284a34;
        }
    </style>
</head>
<body>

    <div class="grid" id="grid"></div>

    <script>
        const products = [
            "Кружка керамическая",
            "Блокнот в клетку",
            "Ручка гелевая",
            "Наушники проводные",
            "Чехол для телефона",
            "Термокружка",
            "Коврик для мыши",
            "Лампа настольная",
            "Кабель USB",
            "Пенал",
            "Зарядка беспроводная",
            "Флешка 32 ГБ",
            "Рюкзак городской",
            "Зонт складной",
            "Бутылка для воды",
            "Стикеры для заметок",
            "Клавиатура",
            "Подставка для ноутбука",
            "Кольцо для ключей",
            "Кошелёк",
            "Брелок",
            "Носки (пара)",
            "Шапка",
            "Перчатки",
            "Очки солнцезащитные",
            "Часы наручные",
            "Браслет"
        ];

        const grid = document.getElementById('grid');

        products.forEach(function(title) {
            const card = document.createElement('div');
            card.className = 'card';

            const inner = document.createElement('div');
            inner.className = 'card-inner';

            // Картинка (квадрат, занимает остаток)
            const image = document.createElement('div');
            image.className = 'card-image';
            image.textContent = '?';

            // Отступ 0.7
            const spacer07 = document.createElement('div');
            spacer07.className = 'spacer-07';

            // Название
            const titleEl = document.createElement('div');
            titleEl.className = 'card-title';
            titleEl.textContent = title;

            // Промежуток 0.5
            const spacer05 = document.createElement('div');
            spacer05.className = 'spacer-05';

            // Кнопка
            const btn = document.createElement('button');
            btn.className = 'card-btn';
            btn.textContent = 'В корзину';

            inner.appendChild(image);
            inner.appendChild(spacer07);
            inner.appendChild(titleEl);
            inner.appendChild(spacer05);
            inner.appendChild(btn);
            card.appendChild(inner);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
