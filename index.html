<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(-45deg, #7fa88a, #6b9478, #86ad90, #5f8a6c);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            padding: 12px;
            padding-top: 64px;
            padding-bottom: 40px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== Закреплённая верхняя панель ===== */
        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        /* Поисковая панель */
        .search-panel {
            flex: 1;
            min-width: 0;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 0 12px;
            box-shadow: 0 2px 8px rgba(40, 70, 50, 0.25);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            color: #2f5a3d;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Comfortaa', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #2f5a3d;
        }

        .search-input::placeholder {
            color: #7a9a85;
            font-weight: 600;
        }

        /* Правая часть верхней панели — фильтры */
        .action-bar {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex: 0 0 auto;
        }

        .filter-btn {
            width: 44px;
            height: 44px;
            background: #345c42;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(40, 70, 50, 0.3);
            padding: 0;
        }

        .filter-btn:active { background: #284a34; }

        .filter-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .filter-icon span {
            display: block;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
        }

        .filter-icon span:nth-child(1) { width: 18px; }
        .filter-icon span:nth-child(2) { width: 12px; }
        .filter-icon span:nth-child(3) { width: 6px; }

        .filter-menu {
            display: none;
            margin-top: 8px;
            background: rgba(52, 92, 66, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 10px;
            width: 260px;
            box-shadow: 0 4px 14px rgba(30, 60, 40, 0.4);
        }

        .filter-menu.open { display: block; }

        /* Строка: категории слева, сортировка справа */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: flex-start;
        }

        /* Блок категорий */
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 7px;
            padding: 5px 6px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 9px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease;
        }

        .category-btn.active {
            background: #ffffff;
            color: #2f5a3d;
        }

        /* Блок сортировки */
        .sort-buttons {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 0 0 auto;
        }

        .sort-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 7px;
            padding: 5px 6px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 9px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
        }

        .sort-btn.active {
            background: #ffffff;
            color: #2f5a3d;
        }

        .price-range {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .price-range input {
            flex: 1;
            width: 0;
            min-width: 0;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 7px 6px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #2f5a3d;
            outline: none;
        }

        .price-range span {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
        }

        /* ===== Сетка ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(40, 70, 50, 0.25);
            aspect-ratio: 1 / 1.618;
            display: flex;
            flex-direction: column;
            padding: 10%;
            min-width: 0;
            overflow: hidden;
        }

        .card-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .card-image {
            flex: 1 1 auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            user-select: none;
            overflow: hidden;
            min-height: 0;
        }

        .card-title {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            line-height: 1.15;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 0.9px #2f5a3d;
            paint-order: stroke fill;
            text-shadow: 0 1px 2px rgba(30, 60, 40, 0.4);
            overflow: hidden;
            padding: 2px 1px 0;
            word-break: break-word;
            overflow-wrap: anywhere;
            min-height: calc(2 * 1.15em);
        }

        .card-price {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 10.5px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            line-height: 1;
            padding-bottom: 0;
            margin-bottom: -1px;
        }

        .card-btn {
            flex: 0 0 auto;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #345c42;
            border: none;
            border-radius: 7px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 0.8px #1f3a29;
            paint-order: stroke fill;
            cursor: pointer;
            padding: 0 2px;
            white-space: nowrap;
            overflow: hidden;
            margin-top: 2px;
        }

        .card-btn:active { background: #284a34; }
    </style>
</head>
<body>

    <!-- Закреплённая верхняя панель: поиск слева, фильтры справа -->
    <div class="top-bar">
        <div class="search-panel">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="ищу...">
        </div>
        <div class="action-bar">
            <button class="filter-btn" id="filterBtn" aria-label="Фильтры">
                <span class="filter-icon">
                    <span></span><span></span><span></span>
                </span>
            </button>
            <div class="filter-menu" id="filterMenu">
                <div class="filter-row">
                    <div class="categories" id="categories"></div>
                    <div class="sort-buttons">
                        <button class="sort-btn" id="sortDown">Цена ↓</button>
                        <button class="sort-btn" id="sortUp">Цена ↑</button>
                    </div>
                </div>
                <div class="price-range">
                    <input type="number" id="priceMin" placeholder="от" min="0">
                    <span>—</span>
                    <input type="number" id="priceMax" placeholder="до" min="0">
                </div>
            </div>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        // Категории
        const CATEGORIES = ['godly', 'ancient', 'vintage', 'ножи', 'пистолеты'];

        const products = [
            { title: "Кружка керамическая", price: 450, category: "vintage" },
            { title: "Блокнот в клетку", price: 320, category: "vintage" },
            { title: "Ручка гелевая", price: 90, category: "vintage" },
            { title: "Наушники проводные", price: 1200, category: "ancient" },
            { title: "Чехол для телефона", price: 690, category: "ancient" },
            { title: "Термокружка", price: 890, category: "vintage" },
            { title: "Коврик для мыши", price: 550, category: "ancient" },
            { title: "Лампа настольная", price: 1490, category: "godly" },
            { title: "Кабель USB", price: 250, category: "ancient" },
            { title: "Пенал", price: 380, category: "vintage" },
            { title: "Зарядка беспроводная", price: 1290, category: "ancient" },
            { title: "Флешка 32 ГБ", price: 640, category: "ancient" },
            { title: "Рюкзак городской", price: 2490, category: "godly" },
            { title: "Зонт складной", price: 790, category: "vintage" },
            { title: "Бутылка для воды", price: 560, category: "vintage" },
            { title: "Стикеры для заметок", price: 150, category: "vintage" },
            { title: "Клавиатура", price: 1990, category: "godly" },
            { title: "Подставка для ноутбука", price: 890, category: "ancient" },
            { title: "Кольцо для ключей", price: 120, category: "vintage" },
            { title: "Кошелёк", price: 1290, category: "ancient" },
            { title: "Брелок", price: 180, category: "vintage" },
            { title: "Носки (пара)", price: 210, category: "vintage" },
            { title: "Шапка", price: 690, category: "vintage" },
            { title: "Перчатки", price: 750, category: "vintage" },
            { title: "Очки солнцезащитные", price: 1190, category: "ancient" },
            { title: "Часы наручные", price: 3490, category: "godly" },
            { title: "Браслет", price: 390, category: "vintage" }
        ];

        // Дополнительные товары в категориях "ножи" и "пистолеты"
        products.push(
            { title: "Нож складной", price: 1590, category: "ножи" },
            { title: "Нож охотничий", price: 2790, category: "ножи" },
            { title: "Нож кухонный", price: 890, category: "ножи" },
            { title: "Пистолет водяной", price: 490, category: "пистолеты" },
            { title: "Пистолет пневматический", price: 3990, category: "пистолеты" },
            { title: "Пистолет страйкбольный", price: 2190, category: "пистолеты" }
        );

        const grid = document.getElementById('grid');

        let sortOrder = null;
        let minPrice = null;
        let maxPrice = null;
        let selectedCategories = []; // выбранные категории (мультивыбор)
        let searchQuery = '';        // поисковый запрос

        // Создаём кнопки категорий
        const categoriesContainer = document.getElementById('categories');
        CATEGORIES.forEach(function(cat) {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.textContent = cat;
            btn.dataset.category = cat;
            btn.addEventListener('click', function() {
                const idx = selectedCategories.indexOf(cat);
                if (idx === -1) {
                    selectedCategories.push(cat);
                    btn.classList.add('active');
                } else {
                    selectedCategories.splice(idx, 1);
                    btn.classList.remove('active');
                }
                render();
            });
            categoriesContainer.appendChild(btn);
        });

        function render() {
            let list = products.filter(function(p) {
                if (minPrice !== null && p.price < minPrice) return false;
                if (maxPrice !== null && p.price > maxPrice) return false;
                if (selectedCategories.length > 0 && selectedCategories.indexOf(p.category) === -1) return false;
                // Поиск по названию (без учёта регистра)
                if (searchQuery !== '' && p.title.toLowerCase().indexOf(searchQuery) === -1) return false;
                return true;
            });

            if (sortOrder === 'down') list.sort((a, b) => b.price - a.price);
            if (sortOrder === 'up') list.sort((a, b) => a.price - b.price);

            grid.innerHTML = '';

            list.forEach(function(product) {
                const card = document.createElement('div');
                card.className = 'card';

                const inner = document.createElement('div');
                inner.className = 'card-inner';

                const image = document.createElement('div');
                image.className = 'card-image';
                image.textContent = '?';

                const titleEl = document.createElement('div');
                titleEl.className = 'card-title';
                titleEl.textContent = product.title;

                const priceEl = document.createElement('div');
                priceEl.className = 'card-price';
                priceEl.textContent = product.price + ' ₽';

                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.textContent = 'В корзину';

                inner.appendChild(image);
                inner.appendChild(titleEl);
                inner.appendChild(priceEl);
                inner.appendChild(btn);
                card.appendChild(inner);
                grid.appendChild(card);
            });
        }

        const filterBtn = document.getElementById('filterBtn');
        const filterMenu = document.getElementById('filterMenu');

        filterBtn.addEventListener('click', function() {
            filterMenu.classList.toggle('open');
        });

        const sortDownBtn = document.getElementById('sortDown');
        const sortUpBtn = document.getElementById('sortUp');

        sortDownBtn.addEventListener('click', function() {
            if (sortOrder === 'down') {
                sortOrder = null;
                sortDownBtn.classList.remove('active');
            } else {
                sortOrder = 'down';
                sortDownBtn.classList.add('active');
                sortUpBtn.classList.remove('active');
            }
            render();
        });

        sortUpBtn.addEventListener('click', function() {
            if (sortOrder === 'up') {
                sortOrder = null;
                sortUpBtn.classList.remove('active');
            } else {
                sortOrder = 'up';
                sortUpBtn.classList.add('active');
                sortDownBtn.classList.remove('active');
            }
            render();
        });

        const priceMinInput = document.getElementById('priceMin');
        const priceMaxInput = document.getElementById('priceMax');

        priceMinInput.addEventListener('input', function() {
            minPrice = this.value === '' ? null : Number(this.value);
            render();
        });

        priceMaxInput.addEventListener('input', function() {
            maxPrice = this.value === '' ? null : Number(this.value);
            render();
        });

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function() {
            searchQuery = this.value.trim().toLowerCase();
            render();
        });

        render();
    </script>
</body>
</html>
