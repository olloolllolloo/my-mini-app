<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Красивый шрифт с кириллицей -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Плавная переливашка фона */
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Comfortaa', sans-serif;
            /* Пастельно-зелёный градиент, который плавно переливается */
            background: linear-gradient(-45deg, #e8f5e9, #d4ecdd, #e6f4ea, #cfe8d8);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            padding: 12px;
            padding-top: 20px;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        /* Сетка: ровно 3 колонки */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* Карточка в пропорции золотого сечения */
        .card {
            /* Карточка слегка сливается с фоном: полупрозрачный белый + лёгкая тень */
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(120, 160, 130, 0.15);
            aspect-ratio: 1 / 1.618;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Лёгкий отклик на нажатие */
        .card:active {
            transform: scale(0.97);
            box-shadow: 0 1px 4px rgba(120, 160, 130, 0.2);
        }

        /* Верхняя часть — знак вопроса вместо картинки */
        .card-image {
            flex: 1;
            background: rgba(212, 236, 221, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #8fae9a;
            font-weight: 600;
            user-select: none;
        }

        /* Нижняя часть — название, выровненное по одной линии */
        .card-title {
            /* Фиксированная высота, чтобы все названия были на одном уровне */
            height: 44px;
            padding: 6px 5px;
            font-size: 11px;
            line-height: 1.25;
            font-weight: 400;
            text-align: center;
            color: #3d5a47;
            background: rgba(255, 255, 255, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            /* Ровно две строки, лишнее обрезается */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="grid" id="grid"></div>

    <script>
        const products = [
            "Кружка керамическая",
            "Блокнот в клетку",
            "Ручка гелевая",
            "Наушники проводные",
            "Чехол для телефона",
            "Термокружка",
            "Коврик для мыши",
            "Лампа настольная",
            "Кабель USB",
            "Пенал",
            "Зарядка беспроводная",
            "Флешка 32 ГБ",
            "Рюкзак городской",
            "Зонт складной",
            "Бутылка для воды",
            "Стикеры для заметок",
            "Клавиатура",
            "Подставка для ноутбука",
            "Кольцо для ключей",
            "Кошелёк",
            "Брелок",
            "Носки (пара)",
            "Шапка",
            "Перчатки",
            "Очки солнцезащитные",
            "Часы наручные",
            "Браслет"
        ];

        const grid = document.getElementById('grid');

        products.forEach(function(title) {
            const card = document.createElement('div');
            card.className = 'card';

            const image = document.createElement('div');
            image.className = 'card-image';
            image.textContent = '?';

            const titleEl = document.createElement('div');
            titleEl.className = 'card-title';
            titleEl.textContent = title;

            card.appendChild(image);
            card.appendChild(titleEl);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
