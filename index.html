<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Comfortaa', sans-serif;
            background: linear-gradient(-45deg, #7fa88a, #6b9478, #86ad90, #5f8a6c);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            padding: 12px;
            padding-top: 64px;
            padding-bottom: 40px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== Панель действий ===== */
        .action-bar {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .filter-btn {
            width: 44px;
            height: 44px;
            background: #345c42;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(40, 70, 50, 0.3);
            padding: 0;
        }

        .filter-btn:active { background: #284a34; }

        .filter-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .filter-icon span {
            display: block;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
        }

        .filter-icon span:nth-child(1) { width: 18px; }
        .filter-icon span:nth-child(2) { width: 12px; }
        .filter-icon span:nth-child(3) { width: 6px; }

        .filter-menu {
            display: none;
            margin-top: 8px;
            background: rgba(52, 92, 66, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 10px;
            width: 200px;
            box-shadow: 0 4px 14px rgba(30, 60, 40, 0.4);
        }

        .filter-menu.open { display: block; }

        .sort-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .sort-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 4px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }

        .sort-btn.active {
            background: #ffffff;
            color: #2f5a3d;
        }

        .price-range {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .price-range input {
            flex: 1;
            width: 0;
            min-width: 0;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 7px 6px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #2f5a3d;
            outline: none;
        }

        .price-range span {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
        }

        /* ===== Сетка ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(40, 70, 50, 0.25);
            aspect-ratio: 1 / 1.618;
            display: flex;
            flex-direction: column;
            padding: 10%;
            min-width: 0;
            overflow: hidden;
        }

        .card-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        /* КАРТИНКА — уже не строгий квадрат, а всё оставшееся место */
        .card-image {
            flex: 1 1 auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            user-select: none;
            overflow: hidden;
            min-height: 0;
        }

        /* Название — высота по фактическому числу строк */
        .card-title {
            flex: 0 0 auto;
            display: block;
            text-align: center;
            font-size: 12px;
            line-height: 1.15;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 0.9px #2f5a3d;
            paint-order: stroke fill;
            text-shadow: 0 1px 2px rgba(30, 60, 40, 0.4);
            overflow: hidden;
            padding: 2px 1px 0;
            word-break: break-word;
            overflow-wrap: anywhere;
            /* Резервируем место ровно под две строки, чтобы сетка не прыгала,
               но если текст в одну строку — он занимает одну строку,
               а пустое место остаётся между названием и картинкой */
            min-height: calc(2 * 1.15em);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Цена — снова БЕЛАЯ, вплотную к кнопке */
        .card-price {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            line-height: 1;
            padding-bottom: 0;
            margin-bottom: -1px;
        }

        /* Кнопка — чуть меньше */
        .card-btn {
            flex: 0 0 auto;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #345c42;
            border: none;
            border-radius: 7px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 0.8px #1f3a29;
            paint-order: stroke fill;
            cursor: pointer;
            padding: 0 2px;
            white-space: nowrap;
            overflow: hidden;
            margin-top: 2px;
        }

        .card-btn:active { background: #284a34; }
    </style>
</head>
<body>

    <div class="action-bar">
        <button class="filter-btn" id="filterBtn" aria-label="Фильтры">
            <span class="filter-icon">
                <span></span><span></span><span></span>
            </span>
        </button>
        <div class="filter-menu" id="filterMenu">
            <div class="sort-buttons">
                <button class="sort-btn" id="sortDown">Цена ↓</button>
                <button class="sort-btn" id="sortUp">Цена ↑</button>
            </div>
            <div class="price-range">
                <input type="number" id="priceMin" placeholder="от" min="0">
                <span>—</span>
                <input type="number" id="priceMax" placeholder="до" min="0">
            </div>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        const products = [
            { title: "Кружка керамическая", price: 450 },
            { title: "Блокнот в клетку", price: 320 },
            { title: "Ручка гелевая", price: 90 },
            { title: "Наушники проводные", price: 1200 },
            { title: "Чехол для телефона", price: 690 },
            { title: "Термокружка", price: 890 },
            { title: "Коврик для мыши", price: 550 },
            { title: "Лампа настольная", price: 1490 },
            { title: "Кабель USB", price: 250 },
            { title: "Пенал", price: 380 },
            { title: "Зарядка беспроводная", price: 1290 },
            { title: "Флешка 32 ГБ", price: 640 },
            { title: "Рюкзак городской", price: 2490 },
            { title: "Зонт складной", price: 790 },
            { title: "Бутылка для воды", price: 560 },
            { title: "Стикеры для заметок", price: 150 },
            { title: "Клавиатура", price: 1990 },
            { title: "Подставка для ноутбука", price: 890 },
            { title: "Кольцо для ключей", price: 120 },
            { title: "Кошелёк", price: 1290 },
            { title: "Брелок", price: 180 },
            { title: "Носки (пара)", price: 210 },
            { title: "Шапка", price: 690 },
            { title: "Перчатки", price: 750 },
            { title: "Очки солнцезащитные", price: 1190 },
            { title: "Часы наручные", price: 3490 },
            { title: "Браслет", price: 390 }
        ];

        const grid = document.getElementById('grid');

        let sortOrder = null;
        let minPrice = null;
        let maxPrice = null;

        function render() {
            let list = products.filter(function(p) {
                if (minPrice !== null && p.price < minPrice) return false;
                if (maxPrice !== null && p.price > maxPrice) return false;
                return true;
            });

            if (sortOrder === 'down') list.sort((a, b) => b.price - a.price);
            if (sortOrder === 'up') list.sort((a, b) => a.price - b.price);

            grid.innerHTML = '';

            list.forEach(function(product) {
                const card = document.createElement('div');
                card.className = 'card';

                const inner = document.createElement('div');
                inner.className = 'card-inner';

                const image = document.createElement('div');
                image.className = 'card-image';
                image.textContent = '?';

                const titleEl = document.createElement('div');
                titleEl.className = 'card-title';
                titleEl.textContent = product.title;

                const priceEl = document.createElement('div');
                priceEl.className = 'card-price';
                priceEl.textContent = product.price + ' ₽';

                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.textContent = 'В корзину';

                inner.appendChild(image);
                inner.appendChild(titleEl);
                inner.appendChild(priceEl);
                inner.appendChild(btn);
                card.appendChild(inner);
                grid.appendChild(card);
            });
        }

        const filterBtn = document.getElementById('filterBtn');
        const filterMenu = document.getElementById('filterMenu');

        filterBtn.addEventListener('click', function() {
            filterMenu.classList.toggle('open');
        });

        const sortDownBtn = document.getElementById('sortDown');
        const sortUpBtn = document.getElementById('sortUp');

        sortDownBtn.addEventListener('click', function() {
            if (sortOrder === 'down') {
                sortOrder = null;
                sortDownBtn.classList.remove('active');
            } else {
                sortOrder = 'down';
                sortDownBtn.classList.add('active');
                sortUpBtn.classList.remove('active');
            }
            render();
        });

        sortUpBtn.addEventListener('click', function() {
            if (sortOrder === 'up') {
                sortOrder = null;
                sortUpBtn.classList.remove('active');
            } else {
                sortOrder = 'up';
                sortUpBtn.classList.add('active');
                sortDownBtn.classList.remove('active');
            }
            render();
        });

        const priceMinInput = document.getElementById('priceMin');
        const priceMaxInput = document.getElementById('priceMax');

        priceMinInput.addEventListener('input', function() {
            minPrice = this.value === '' ? null : Number(this.value);
            render();
        });

        priceMaxInput.addEventListener('input', function() {
            maxPrice = this.value === '' ? null : Number(this.value);
            render();
        });

        render();
    </script>
</body>
</html>
